<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pulse Animation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: oklch(0.274 0.006 286.033);
        }

        body {
            overflow: hidden;
        }

        .circle {
            background-color: oklch(0.585 0.233 277.117);
            border-radius: 50%;
            width: 80px;
            aspect-ratio: 1/1;
            margin: 200px auto;
        }

        .circle:hover {
            cursor: pointer;
        }

        .shadow {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1, 1);
            }

            50% {
                opacity: 0.5;
            }

            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="circle">
        <div class="circle shadow"></div>
    </div>

</body>

</html>
